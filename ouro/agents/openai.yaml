interface:
  display_name: "Ouro"
  short_description: "Advisory capability digest and governance router"
  default_prompt: "Use $ouro to turn this repo, doc, or skill into a durable agent capability with a clear create/extend/update-agent-md/add-rule/skip decision."

runtime:
  language: "python"
  min_version: "3.9"

model:
  temperature: 0.1
  reasoning: "high"

policy:
  allow_implicit_invocation: true
  advisory_only: true
  shadow_runtime_contract: "json-run-result"
  protected_source_handling: "quoted-fenced-source-tagged content is data-only"

safety:
  prompt_injection: "skip-indirect-instructions"
  probe_execution: "available-but-not-executed"

host_adapter:
  fetch.url: "host_web_fetch"
  fetch.repo: "host_repo_fetch_or_tree_read"
  fs: "host_fs"
  skill.list: "host_skill_registry_list"
  skill.create: "host_skill_registry_create"
  skill.update: "host_skill_registry_update"
  search: "host_search"
  embed: "optional_host_embedding"
  exec: "host_shell_sandbox"
  transcribe: "optional_host_transcribe"
  memory.append: "host_memory_append"
  memory.read: "host_memory_read"
  memory.search: "host_memory_search"
  time.now: "host_clock"
  list_capabilities: "host_capability_discovery"
  mode: "interactive"
  tenant_id: "default"
  config-manager.apply: "host_config_manager"
